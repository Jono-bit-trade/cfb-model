name: weekly-predictions

on:
  schedule:
    # Times are UTC; Central is 5 hours behind until early November, then 6.
    - cron: "0 23 * * 0"        # Sunday evening: full refresh after Saturday's games, early picks lock
    - cron: "0 3 * * 2"         # Monday night: full refresh, picks, backtest
    - cron: "0 14 * * 3-6"      # Wed-Sat mornings: latest lines, kickoff forecasts, QB status
    - cron: "0 2,4 * * 5,6"     # Thu and Fri nights: scores as games end
    - cron: "0 18,20,22 * * 6"  # Saturday afternoon: scores as games end
    - cron: "0 0,2,4,6 * * 0"   # Saturday night: scores as games end
  workflow_dispatch:            # adds a "Run workflow" button on the Actions tab

concurrency:
  group: weekly-predictions
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Download data
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
        run: |
          case "${{ github.event.schedule }}" in
            "0 23 * * 0"|"0 3 * * 2"|"")   # Sunday, Monday, or a manual run
              python src/get_data.py ;;     # this season's results, box scores and lines (history only if missing)
            *)
              python src/get_data.py --quick ;;  # 4 calls: latest scores and betting lines
          esac

      - name: Save downloaded data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update data $(date -u +%Y-%m-%d)" || echo "No new data"
          git pull --rebase
          git push

      - name: Predict
        run: python src/predict.py

      - name: Backtest
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * 2'
        run: python src/backtest.py

      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "Update predictions $(date -u +%Y-%m-%d)" || echo "No changes"
          git pull --rebase
          git push
