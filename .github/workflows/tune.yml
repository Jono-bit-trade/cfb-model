name: tune-model

# Manual: Actions tab -> tune-model -> Run workflow. Takes roughly 20-60 minutes.
# Finds the best settings on older seasons, checks them on the 3 newest, saves
# data/tuned.json, then reruns the backtest and predictions with the tuned model.
on:
  workflow_dispatch:

concurrency:
  group: weekly-predictions
  cancel-in-progress: false

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tune
        run: python src/tune.py
      - name: Backtest and predict with the tuned settings
        run: |
          python src/backtest.py
          python src/predict.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "Tune model $(date -u +%Y-%m-%d)" || echo "No changes"
          git pull --rebase
          git push
